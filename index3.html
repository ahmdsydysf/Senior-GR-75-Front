<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
  <div class="input-group mb-3">
    <span class="input-group-text" id="basic-addon1">myPassword</span>
    <input id="usernameInput" type="text" class="form-control" placeholder="Username" aria-label="Username"
      aria-describedby="basic-addon1">
  </div>
  <div class="input-group mb-3 password">
    <span class="input-group-text" id="basic-addon1">PassLength</span>
    <input id="passwordInput" type="text" class="form-control" placeholder="password" aria-label="Username"
      aria-describedby="basic-addon1">
    <i class="fa-solid fa-eye" onclick="viewPassword()"></i>
  </div>
  <button class="btn btn-info" onclick="generate()">go</button>
  <button class="btn btn-info" onclick="takePWcopy()">copy</button>

  <header class="msg">

  </header>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script>
    function takePWcopy() {
      var myPassword = window.location.href;
      var newInputElem = document.createElement('input');
      var msgContainer = document.querySelector('header.msg');

      newInputElem.value = myPassword;

      msgContainer.appendChild(newInputElem);

      newInputElem.select();

      document.execCommand('copy');

      newInputElem.style.display = 'none';

    }
    function generate() {
      var lorem =
        "ask8784515fafascdfs523af4we89fw4897r5289%^&*#&*(*)__WQ!1234yhrjkncsdjkgweytrw378ry";
      var myPassword = document.getElementById("usernameInput");
      var mylength = document.getElementById("passwordInput");

      if (mylength.value >= 6) {
        var finalPass = "";
        //01234567
        var msgContainer = document.querySelector('header.msg');
        msgContainer.innerHTML = '';
        for (var i = 0; i < mylength.value; i++) {

          var r = Math.round(Math.random() * lorem.length);//5 60
          finalPass += lorem.slice(r, r + 1);

          var nwElem = document.createElement('h4');
          var randomClr1 = Math.round(Math.random() * 255);
          var randomClr2 = Math.round(Math.random() * 255);
          var randomClr3 = Math.round(Math.random() * 255);
          nwElem.innerText = 'hi mohamed and mazen';
          msgContainer.appendChild(nwElem);
          nwElem.style.backgroundColor = `rgb(${randomClr1} , ${randomClr2} , ${randomClr3})`

        }
        myPassword.value = finalPass;
      } else {
        myPassword.value = "Plz try again more than 6 char";
      }
    }
  </script>

</body>

</html>
