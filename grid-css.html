<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            background-color: black;
        }

        * {
            box-sizing: border-box;
        }



        .item {
            background-color: royalblue;
            color: seashell;
            font-size: 30px;
            padding: 15px;
            border: 10px solid rgb(43, 69, 148);
        }

        .lg {
            grid-area: logo;
        }

        .nv {
            grid-area: nav;

        }

        .sid {
            grid-area: sid;

        }

        .content {
            grid-area: cont;

        }

        .footer {
            grid-area: foot;

        }

        .main {
            background-color: rgb(42, 42, 42);
            padding: 25px;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: 150px 600px 100px 150px;
            grid-template-areas:
                "logo logo nav   nav  nav nav  nav  nav nav nav"
                "cont cont cont cont cont cont cont sid sid sid"
                "cont cont cont cont cont cont cont sid sid sid"
                "foot foot foot foot foot foot foot foot foot foot"
            ;
        }
    </style>
</head>

<body>


    <header class="main">
        <div class="item lg">logo</div>
        <div class="item nv">nav</div>
        <div class="item sid">4</div>
        <div class="item content">
            <div>div 1</div>
            <div>div 2</div>
            <div>div 3</div>
            <div>div 4</div>
            <div>div 5</div>
        </div>
        <div class="item footer">6</div>

    </header>
</body>

</html>
