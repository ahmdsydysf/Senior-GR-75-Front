<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    .password {
      position: relative;
    }

    .fa-solid.fa-eye {
      position: absolute;
      top: 25%;
      right: 15px;
    }
  </style>
</head>

<body>

  <button onclick="createElementPost()">create Element</button>

  <div class="container">
    <div class="row">

      <div class="input-group mb-3">
        <span class="input-group-text" id="basic-addon1">myPassword</span>
        <input id="usernameInput" type="text" class="form-control" placeholder="Username" aria-label="Username"
          aria-describedby="basic-addon1">
      </div>
      <div class="input-group mb-3 password">
        <span class="input-group-text" id="basic-addon1">PassLength</span>
        <input id="passwordInput" type="text" class="form-control" placeholder="password" aria-label="Username"
          aria-describedby="basic-addon1">
        <i class="fa-solid fa-eye" onclick="viewPassword()"></i>
      </div>

      <button class="btn btn-info" onclick="gen()">go</button>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="js/main.js"></script>
</body>

</html>
